# Publica DEADLINE en GitHub Pages (gratuito para repositorios públicos).
#
# Activación (una sola vez, en GitHub):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Después: pestaña Actions → "Publicar en GitHub Pages" → Run workflow,
# o hacer push a la rama de desarrollo (o a main, si se crea).
#
# El sitio queda en https://<usuario>.github.io/Deadline/
name: Publicar en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, claude/deadline-detective-app-ejx239]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run content
      - name: Build
        run: npm run build -w @deadline/web
        env:
          DEADLINE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
